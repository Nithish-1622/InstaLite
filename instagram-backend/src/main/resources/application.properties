# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
server.port=8080

# Return the exception message ("message":"...") in error responses, so the
# frontend can show friendly validation messages such as 400/404 reasons.
server.error.include-message=always

# ------------------------------------------------------------------
# MySQL connection
# The database `instagram_db` is created automatically on first start
# (createDatabaseIfNotExist=true). Change username/password here if
# your MySQL installation uses different credentials.
# The password can also be supplied with the MYSQL_PASSWORD env var.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/instagram_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------
# Hibernate: create the five tables from the entity classes.
# Use `validate` in production once the tables already exist.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# ------------------------------------------------------------------
# File uploads (media is stored on disk, only the path goes to MySQL)
# ------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.upload.dir=uploads

# ------------------------------------------------------------------
# Scalability notes (see README):
#  - Redis could be added later as spring.data.redis.* for caching
#    popular posts and frequently accessed feeds.
#  - Kafka/RabbitMQ would replace the in-process media processing
#    simulation in PostService when background workers are needed.
#  - Object storage (S3) would replace the local uploads/ folder.
# ------------------------------------------------------------------
